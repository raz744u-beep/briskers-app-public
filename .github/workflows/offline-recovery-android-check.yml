name: Offline recovery Android debug verification
on:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/release_upgrade_fixture_test.dart'
      - '.github/workflows/android-debug.yml'
      - 'test/services/local_owner_invoice_numbering_test.dart'
      - 'test/services/local_numbered_document_overlay_test.dart'
      - '.github/workflows/offline-recovery-android-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Create temporary Android runner before resolving the release dependencies
        run: |
          flutter create --no-pub --platforms=android --project-name briskers_app .
          git restore -- pubspec.yaml pubspec.lock
      - name: Resolve packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flutter pub get
          bash "$GITHUB_WORKSPACE/tools/ci_sqlite_assets.sh"
      - name: Generate local database code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Check targeted offline recovery tests
        run: |
          flutter test test/services/local_owner_invoice_numbering_test.dart
          flutter test test/services/local_numbered_document_overlay_test.dart
      - name: Stage verified Gradle distribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/tools/ci_gradle_distribution.sh"

      - name: Configure offline task reminder Android requirements
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          s=p.read_text().replace('compileSdk = flutter.compileSdkVersion','compileSdk = 37').replace('minSdk = flutter.minSdkVersion','minSdk = 24')
          s=s.replace('compileOptions {','compileOptions {\n        isCoreLibraryDesugaringEnabled = true',1)
          s+='\ndependencies { coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4") }\n'
          p.write_text(s)
          icon=Path('android/app/src/main/res/drawable/ic_task_reminder.xml')
          icon.parent.mkdir(parents=True,exist_ok=True)
          icon.write_text('<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#00000000" android:strokeColor="#FFFFFFFF" android:strokeWidth="2" android:strokeLineCap="round" android:pathData="M12,3 A9,9 0,1 0,12 21 A9,9 0,0 0,12 3 M12,7 L12,12 L16,15" /></vector>')
          keep=Path('android/app/src/main/res/raw/briskers_notification_keep.xml')
          keep.parent.mkdir(parents=True,exist_ok=True)
          keep.write_text('<resources xmlns:tools="http://schemas.android.com/tools" tools:keep="@drawable/ic_task_reminder" />')
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          m=manifest.read_text().replace('<application','<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n<application',1)
          m=m.replace('</application>','<receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" /><receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED" /><action android:name="android.intent.action.MY_PACKAGE_REPLACED" /></intent-filter></receiver></application>',1)
          manifest.write_text(m)
          PYTHON
      - name: Compile Android debug APK
        run: flutter build apk --debug
      - name: Verify APK exists
        run: test -s build/app/outputs/flutter-apk/app-debug.apk

      - name: Record production reminder method-channel request
        run: flutter test test/nov13_local_reminders_test.dart --reporter expanded
      - name: Enable reminder emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify offline debug reminder scheduling and delivery
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: |
            adb install build/app/outputs/flutter-apk/app-debug.apk
            bash tools/verify_android_task_reminders.sh build/app/outputs/flutter-apk/app-debug.apk build/reminder-qa/request.json debug build/reminder-qa/debug
      - name: Upload debug reminder proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briskers-debug-reminder-evidence
          path: build/reminder-qa/
          if-no-files-found: error
