name: Build iOS for TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      APPLE_TEAM_ID: 2L4T6BTW73
      IOS_BUNDLE_ID: com.briskers.app

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create iOS project shell
        run: |
          mkdir generated
          cd generated
          flutter create --platforms=ios --org com.briskers --project-name briskers_app .
          rm -rf lib test
          cp -R ../lib ./lib
          cp -R ../test ./test
          if [ -d ../assets ]; then cp -R ../assets ./assets; fi
          cp ../pubspec.yaml ./pubspec.yaml
          cp ../analysis_options.yaml ./analysis_options.yaml

      - name: Configure Briskers iOS identity
        working-directory: generated
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("ios/Runner.xcodeproj/project.pbxproj")
          s = p.read_text()
          s = s.replace("PRODUCT_BUNDLE_IDENTIFIER = com.briskers.briskersApp;", "PRODUCT_BUNDLE_IDENTIFIER = com.briskers.app;")
          s = s.replace("PRODUCT_BUNDLE_IDENTIFIER = com.briskers.briskersAppTests;", "PRODUCT_BUNDLE_IDENTIFIER = com.briskers.app.RunnerTests;")
          # Flutter's generated project already uses automatic signing.
          # Add only the Apple team; do not force a signing identity on package targets.
          s = s.replace("CODE_SIGN_STYLE = Automatic;", "CODE_SIGN_STYLE = Automatic;\n\t\t\t\tDEVELOPMENT_TEAM = 2L4T6BTW73;")
          p.write_text(s)
          PY

      - name: Resolve packages
        working-directory: generated
        run: flutter pub get

      - name: Analyze Dart
        working-directory: generated
        run: flutter analyze

      - name: Run tests
        working-directory: generated
        run: flutter test

      - name: Verify iOS project builds without signing
        working-directory: generated
        run: |
          VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f1)"
          BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))
          flutter build ios --release --no-codesign --build-name "$VERSION" --build-number "$BUILD_NUMBER"

      - name: Prepare iOS signing files
        working-directory: generated
        env:
          IOS_CERT: ${{ secrets.BRISKERS_IOS_P12_BASE64 }}
          IOS_PROFILE: ${{ secrets.BRISKERS_IOS_PROFILE_BASE64 }}
        run: |
          printf '%s' "$IOS_CERT" | base64 --decode > "$RUNNER_TEMP/briskers.p12"
          printf '%s' "$IOS_PROFILE" | base64 --decode > "$RUNNER_TEMP/briskers.mobileprovision"

      - name: Install iOS signing assets
        working-directory: generated
        env:
          IOS_CERT_PASSWORD: ${{ secrets.BRISKERS_IOS_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/briskers.keychain-db"
          security create-keychain -p briskers-ci "$KEYCHAIN"
          security unlock-keychain -p briskers-ci "$KEYCHAIN"
          security import "$RUNNER_TEMP/briskers.p12" -P "$IOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k briskers-ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID="$(security cms -D -i "$RUNNER_TEMP/briskers.mobileprovision" | plutil -extract UUID raw -)"
          cp "$RUNNER_TEMP/briskers.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install App Store Connect API key
        working-directory: generated
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$APP_STORE_CONNECT_API_PRIVATE_KEY" > "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

      - name: Build and export signed IPA
        working-directory: generated
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f1)"
          BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -archivePath build/ios/archive/Runner.xcarchive -allowProvisioningUpdates -authenticationKeyPath "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8" -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" archive
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>teamID</key><string>$APPLE_TEAM_ID</string>
          <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive -archivePath build/ios/archive/Runner.xcarchive -exportPath build/ios/ipa -exportOptionsPlist ios/ExportOptions.plist -allowProvisioningUpdates -authenticationKeyPath "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8" -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: briskers-ios
          path: generated/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to TestFlight
        working-directory: generated
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA="$(find build/ios/ipa -name '*.ipa' -print -quit)"
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$APP_STORE_CONNECT_API_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
