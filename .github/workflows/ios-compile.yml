name: Briskers iOS compile check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/ios-compile.yml'
      - '.github/workflows/android-debug.yml'
      - 'tools/require_candidate_checks.py'
      - 'tools/tests/test_candidate_checks.py'

# Build/test commands never transmit Flutter or Dart analytics.
env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DASH__SUPPRESS_ANALYTICS: 'true'

permissions:
  contents: read

jobs:
  ios-compile:
    runs-on: macos-26-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS runner
        run: |
          mkdir generated
          cd generated
          flutter create --platforms=ios --org com.briskers --project-name briskers_app .
          rm -rf lib test
          cp -R ../lib ./lib
          cp -R ../test ./test
          if [ -d ../assets ]; then cp -R ../assets ./assets; fi
          cp ../pubspec.yaml ./pubspec.yaml
          cp ../analysis_options.yaml ./analysis_options.yaml
      - name: Enable iOS 15.5 camera and bundled VIN OCR
        run: |
          python3 - <<'PY'
          import plistlib
          import re
          from pathlib import Path

          ios = Path('generated/ios')
          podfile = ios / 'Podfile'
          source = podfile.read_text()
          if re.search(r"^\s*#?\s*platform :ios,", source, flags=re.MULTILINE):
              source = re.sub(r"^\s*#?\s*platform :ios,.*$",
                              "platform :ios, '15.5'", source,
                              count=1, flags=re.MULTILINE)
          else:
              source = "platform :ios, '15.5'\n" + source
          podfile.write_text(source)

          project = ios / 'Runner.xcodeproj' / 'project.pbxproj'
          p = project.read_text()
          p = re.sub(r"IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;",
                     "IPHONEOS_DEPLOYMENT_TARGET = 15.5;", p)
          project.write_text(p)

          info = ios / 'Runner' / 'Info.plist'
          config = plistlib.loads(info.read_bytes())
          config['NSCameraUsageDescription'] = (
              'Capture a VIN barcode or photograph the vehicle VIN label.')
          config['NSPhotoLibraryUsageDescription'] = (
              'Choose an existing VIN label photo to read its characters on-device.')
          info.write_bytes(plistlib.dumps(config))
          PY
      - name: Resolve Flutter dependencies
        working-directory: generated
        run: flutter pub get
      - name: Generate Drift database files
        working-directory: generated
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze shared Flutter code
        working-directory: generated
        run: flutter analyze
      - name: Compile iOS without code signing
        working-directory: generated
        run: flutter build ios --no-codesign

