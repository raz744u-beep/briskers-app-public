name: Owner Delete Android compile check

on:
  pull_request:
    paths:
      - 'lib/services/*owner*'
      - 'lib/services/local_job_graph_delete.dart'
      - 'pubspec.yaml'
      - 'tools/build/configure_owner_device_auth.py'
      - '.github/workflows/owner-delete-android-compile.yml'

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify native configuration preserves app identity
        run: python3 -m unittest discover -s tools/tests -p test_owner_device_auth_config.py
      - name: Create regular-package Android shell
        run: |
          flutter create --platforms=android --org com.briskers --project-name briskers_app generated
          rm -rf generated/lib generated/test
          cp -R lib test generated/
          if [ -d assets ]; then cp -R assets generated/; fi
          cp pubspec.yaml analysis_options.yaml generated/
          python3 tools/build/configure_owner_device_auth.py generated
      - name: Resolve packages and generate database
        working-directory: generated
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
      - name: Compile native Android integration without packaging an APK
        working-directory: generated/android
        run: ./gradlew :app:compileReleaseKotlin
