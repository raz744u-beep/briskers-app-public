name: Approved seven screens Android renders

on:
  push:
    branches: [fix/approved-seven-screens-20261114]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-renders:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Prepare isolated Android render harness
        run: |
          flutter create --platforms=android --org com.briskers.qa --project-name briskers_app generated
          rm -rf generated/lib generated/test
          cp -R lib test assets integration_test test_driver generated/
          cp pubspec.yaml pubspec.lock analysis_options.yaml generated/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('generated/android/app/build.gradle.kts')
          s=p.read_text().replace('minSdk = flutter.minSdkVersion','minSdk = 24')
          s=s.replace('compileSdk = flutter.compileSdkVersion','compileSdk = 37')
          s=s.replace('compileOptions {','compileOptions {\n        isCoreLibraryDesugaringEnabled = true')
          s+='\ndependencies { coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4") }\n'
          p.write_text(s)
          PY
      - name: Resolve verified dependencies
        working-directory: generated
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flutter pub get
          bash "$GITHUB_WORKSPACE/tools/ci_sqlite_assets.sh"
          bash "$GITHUB_WORKSPACE/tools/ci_gradle_distribution.sh"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify production screens on Android with synthetic offline records
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: cd generated && flutter drive --driver=test_driver/approved_screens_driver.dart --target=integration_test/approved_screens_test.dart --dart-define=BRISKERS_ENABLE_OWNER_PAYROLL=true
      - name: Upload actual Android renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-seven-android-renders
          path: generated/build/android-approved-screens/
          if-no-files-found: error
          retention-days: 30
