name: Isolated Receipt OCR TEST APK

on:
  push:
    branches:
      - feature/offline-receipt-ocr-independent-ai-20261102
    paths:
      - 'lib/**'
      - 'test/offline_receipt_*'
      - 'test/expense_receipt_entry_contract_test.dart'
      - '.github/workflows/receipt-isolated-test-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receipt-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies and generate DB code
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
      - name: Test parser, local persistence and receipt UI contract
        run: |
          flutter test test/offline_receipt_parser_test.dart
          flutter test test/offline_receipt_persistence_test.dart
          flutter test test/expense_receipt_entry_contract_test.dart
          flutter test test/offline_receipt_scanner_navigation_test.dart
          flutter test test/offline_receipt_review_raw_ocr_test.dart
      - name: Create Android project
        run: flutter create --platforms=android --org com.briskers --project-name briskers_app .
      - name: Set distinct isolated package and visible TEST label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text()
          before = 'applicationId = "com.briskers.briskers_app"'
          assert before in text, 'Expected generated Android application ID missing'
          # v3 uses a new package because earlier TEST APKs were signed with
          # ephemeral debug certificates, so Android rejects in-place upgrades.
          # Keep the original TEST and production installs untouched.
          text = text.replace(before, 'applicationId = "com.briskers.receipt_ocr_test3"')
          gradle.write_text(text)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text()
          assert 'android:label="briskers_app"' in xml
          assert 'android:name=".MainActivity"' in xml
          xml = xml.replace('android:name=".MainActivity"',
                            'android:name="com.briskers.briskers_app.MainActivity"')
          manifest.write_text(xml.replace(
              'android:label="briskers_app"',
              'android:label="Briskers Receipt TEST 3"'))
          PY
      - name: Build separate debug-signed APK with network sync disabled
        run: |
          # A new versionCode for each CI run avoids the original 1018 clash.
          BUILD_NUMBER=$((300000 + GITHUB_RUN_NUMBER))
          echo "RECEIPT_TEST_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          flutter build apk --debug \
            --build-name=0.10.9.3 \
            --build-number="$BUILD_NUMBER" \
            --dart-define=BRISKERS_RECEIPT_TEST=true \
            --dart-define=BRISKERS_BUILD_NUMBER="RECEIPT-TEST-$BUILD_NUMBER" \
            --dart-define=BRISKERS_SOURCE="$(echo "$GITHUB_SHA" | cut -c1-12)"
      - name: Verify APK identity, debug signature and checksums
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee /tmp/receipt-badging.txt
          grep -q "package: name='com.briskers.receipt_ocr_test3' versionCode='$RECEIPT_TEST_BUILD_NUMBER'" /tmp/receipt-badging.txt
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/receipt-certs.txt
          mkdir -p receipt-apk
          cp "$APK" "receipt-apk/Briskers-Receipt-OCR-TEST3-b$RECEIPT_TEST_BUILD_NUMBER-$(echo "$GITHUB_SHA" | cut -c1-12).apk"
          cp /tmp/receipt-badging.txt receipt-apk/
          cp /tmp/receipt-certs.txt receipt-apk/
          (cd receipt-apk && sha256sum *.apk > SHA256SUMS)
      - name: Upload isolated debug-signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Briskers-Receipt-OCR-TEST
          path: receipt-apk/*
          retention-days: 7
          if-no-files-found: error
