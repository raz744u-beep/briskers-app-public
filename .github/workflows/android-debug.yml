name: Build Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, phase2-local-database]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_USER_HOME: ${{ github.workspace }}/.android

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project shell
        run: |
          mkdir generated
          cd generated
          flutter create --platforms=android --org com.briskers --project-name briskers_app .
          rm -rf lib test
          cp -R ../lib ./lib
          cp -R ../test ./test
          if [ -d ../assets ]; then cp -R ../assets ./assets; fi
          cp ../pubspec.yaml ./pubspec.yaml
          cp ../analysis_options.yaml ./analysis_options.yaml

          cat > android/app/src/main/kotlin/com/briskers/briskers_app/MainActivity.kt <<'KOTLIN'
          package com.briskers.briskers_app

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.provider.DocumentsContract
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val channelName = "com.briskers/expenseiq"
              private val pickFolderRequestCode = 7441
              private var pendingFolderResult: MethodChannel.Result? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      channelName
                  ).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "pickExpenseIqFolder" -> openExpenseIqFolderPicker(result)
                          "readExpenseIqFile" -> {
                              val uriText = call.argument<String>("uri")
                              if (uriText.isNullOrBlank()) {
                                  result.error("invalid_uri", "Receipt URI is missing.", null)
                              } else {
                                  try {
                                      val bytes = contentResolver
                                          .openInputStream(Uri.parse(uriText))
                                          ?.use { it.readBytes() }
                                      if (bytes == null) {
                                          result.error(
                                              "read_failed",
                                              "Could not open the receipt photo.",
                                              null
                                          )
                                      } else {
                                          result.success(bytes)
                                      }
                                  } catch (error: Exception) {
                                      result.error(
                                          "read_failed",
                                          error.message ?: "Could not read receipt photo.",
                                          null
                                      )
                                  }
                              }
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              private fun openExpenseIqFolderPicker(result: MethodChannel.Result) {
                  if (pendingFolderResult != null) {
                      result.error(
                          "picker_busy",
                          "The folder picker is already open.",
                          null
                      )
                      return
                  }

                  pendingFolderResult = result
                  val intent = Intent(Intent.ACTION_OPEN_DOCUMENT_TREE).apply {
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      addFlags(Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION)
                      addFlags(Intent.FLAG_GRANT_PREFIX_URI_PERMISSION)

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          putExtra(
                              DocumentsContract.EXTRA_INITIAL_URI,
                              Uri.parse(
                                  "content://com.android.externalstorage.documents/document/primary%3AExpenseIQ%2Fphotos"
                              )
                          )
                      }
                  }
                  startActivityForResult(intent, pickFolderRequestCode)
              }

              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode != pickFolderRequestCode) return

                  val pending = pendingFolderResult ?: return
                  pendingFolderResult = null

                  val treeUri = data?.data
                  if (resultCode != Activity.RESULT_OK || treeUri == null) {
                      pending.success(null)
                      return
                  }

                  try {
                      contentResolver.takePersistableUriPermission(
                          treeUri,
                          Intent.FLAG_GRANT_READ_URI_PERMISSION
                      )
                  } catch (_: Exception) {
                      // The current grant is still valid for this import session.
                  }

                  try {
                      pending.success(listReceiptPhotos(treeUri))
                  } catch (error: Exception) {
                      pending.error(
                          "folder_read_failed",
                          error.message ?: "Could not read the selected folder.",
                          null
                      )
                  }
              }

              private fun listReceiptPhotos(treeUri: Uri): List<Map<String, String>> {
                  val treeDocumentId = DocumentsContract.getTreeDocumentId(treeUri)
                  val childrenUri = DocumentsContract.buildChildDocumentsUriUsingTree(
                      treeUri,
                      treeDocumentId
                  )
                  val projection = arrayOf(
                      DocumentsContract.Document.COLUMN_DOCUMENT_ID,
                      DocumentsContract.Document.COLUMN_DISPLAY_NAME,
                      DocumentsContract.Document.COLUMN_MIME_TYPE
                  )
                  val photos = mutableListOf<Map<String, String>>()

                  contentResolver.query(
                      childrenUri,
                      projection,
                      null,
                      null,
                      null
                  )?.use { cursor ->
                      val idIndex = cursor.getColumnIndexOrThrow(
                          DocumentsContract.Document.COLUMN_DOCUMENT_ID
                      )
                      val nameIndex = cursor.getColumnIndexOrThrow(
                          DocumentsContract.Document.COLUMN_DISPLAY_NAME
                      )
                      val mimeIndex = cursor.getColumnIndexOrThrow(
                          DocumentsContract.Document.COLUMN_MIME_TYPE
                      )

                      while (cursor.moveToNext()) {
                          val documentId = cursor.getString(idIndex)
                          val name = cursor.getString(nameIndex) ?: continue
                          val mime = cursor.getString(mimeIndex) ?: ""
                          val lower = name.lowercase()

                          if (
                              mime != DocumentsContract.Document.MIME_TYPE_DIR &&
                              (lower.endsWith(".jpg") || lower.endsWith(".jpeg"))
                          ) {
                              val documentUri =
                                  DocumentsContract.buildDocumentUriUsingTree(
                                      treeUri,
                                      documentId
                                  )
                              photos.add(
                                  mapOf(
                                      "name" to name,
                                      "uri" to documentUri.toString()
                                  )
                              )
                          }
                      }
                  }

                  return photos
              }
          }
          KOTLIN

      - name: Configure persistent Android signing
        working-directory: generated
        env:
          BRISKERS_KEYSTORE_BASE64: ${{ secrets.BRISKERS_KEYSTORE_BASE64 }}
          BRISKERS_KEYSTORE_PASSWORD: ${{ secrets.BRISKERS_KEYSTORE_PASSWORD }}
          BRISKERS_KEY_ALIAS: ${{ secrets.BRISKERS_KEY_ALIAS }}
          BRISKERS_KEY_PASSWORD: ${{ secrets.BRISKERS_KEY_PASSWORD }}
        run: |
          printf '%s' "$BRISKERS_KEYSTORE_BASE64" | base64 --decode > android/app/briskers-release.jks
          cat > android/key.properties <<EOF
          storePassword=$BRISKERS_KEYSTORE_PASSWORD
          keyPassword=$BRISKERS_KEY_PASSWORD
          keyAlias=$BRISKERS_KEY_ALIAS
          storeFile=briskers-release.jks
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          s = 'import java.util.Properties\nimport java.io.FileInputStream\n' + s
          marker = 'android {'
          setup = '''val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          '''
          s = s.replace(marker, setup + marker, 1)
          s = s.replace(
              '    buildTypes {',
              '''    signingConfigs {
                  create("briskersRelease") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

              buildTypes {''',
              1,
          )
          s = s.replace(
              '            signingConfig = signingConfigs.getByName("debug")',
              '            signingConfig = signingConfigs.getByName("briskersRelease")',
              1,
          )
          p.write_text(s)
          PY

      - name: Validate permanent signing keystore
        working-directory: generated
        env:
          BRISKERS_KEYSTORE_PASSWORD: ${{ secrets.BRISKERS_KEYSTORE_PASSWORD }}
          BRISKERS_KEY_ALIAS: ${{ secrets.BRISKERS_KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore android/app/briskers-release.jks \
            -storepass "$BRISKERS_KEYSTORE_PASSWORD" \
            -alias "$BRISKERS_KEY_ALIAS" \
            | grep -E "Alias name:|Owner:|SHA256:"
          echo "Permanent Briskers keystore validated."

      - name: Resolve packages
        working-directory: generated
        run: flutter pub get

      - name: Generate local database code
        working-directory: generated
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze Dart
        working-directory: generated
        run: flutter analyze

      - name: Run tests
        working-directory: generated
        run: flutter test

      - name: Build permanently signed Android APK
        working-directory: generated
        run: |
          VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f1)"
          BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))
          flutter build apk --release --build-name "$VERSION" --build-number "$BUILD_NUMBER"

      - name: Verify APK is signed
        working-directory: generated
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          CERTS="$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)"
          printf '%s\n' "$CERTS"
          if printf '%s\n' "$CERTS" | grep -q "CN=Android Debug"; then
            echo "ERROR: APK was signed with a temporary Android Debug certificate."
            exit 1
          fi

      - name: Name APK by version
        working-directory: generated
        run: |
          VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f1)"
          BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/Briskers-v${VERSION}-b${BUILD_NUMBER}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: briskers-android-debug
          path: generated/build/app/outputs/flutter-apk/Briskers-v*.apk
          if-no-files-found: error
          retention-days: 14
