name: Build Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_USER_HOME: ${{ github.workspace }}/.android

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project shell
        run: |
          mkdir generated
          cd generated
          flutter create --platforms=android --org com.briskers --project-name briskers_app .
          rm -rf lib test
          cp -R ../lib ./lib
          cp -R ../test ./test
          if [ -d ../assets ]; then cp -R ../assets ./assets; fi
          cp ../pubspec.yaml ./pubspec.yaml
          cp ../analysis_options.yaml ./analysis_options.yaml

      - name: Resolve packages
        working-directory: generated
        run: flutter pub get

      - name: Analyze Dart
        working-directory: generated
        run: flutter analyze

      - name: Run tests
        working-directory: generated
        run: flutter test

      - name: Build Android debug APK
        working-directory: generated
        run: flutter build apk --debug

      - name: Verify APK is signed
        working-directory: generated
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-debug.apk

      - name: Name APK by version
        working-directory: generated
        run: |
          VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f1)"
          cp build/app/outputs/flutter-apk/app-debug.apk "build/app/outputs/flutter-apk/Briskers-v${VERSION}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: briskers-android-debug
          path: generated/build/app/outputs/flutter-apk/Briskers-v*.apk
          if-no-files-found: error
          retention-days: 14
