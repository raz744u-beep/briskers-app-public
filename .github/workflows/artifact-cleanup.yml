name: Clean old build artifacts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/artifact-cleanup.yml'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove old Briskers artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ['GH_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          artifacts = []
          page = 1
          while True:
              url = f'https://api.github.com/repos/{repo}/actions/artifacts?per_page=100&page={page}'
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  batch = json.load(response).get('artifacts', [])
              artifacts.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          keep_counts = {
              'briskers-android-debug': 2,
              'briskers-ios': 1,
          }

          deleted = 0
          for name, keep in keep_counts.items():
              rows = [
                  item for item in artifacts
                  if item.get('name') == name and not item.get('expired', False)
              ]
              rows.sort(key=lambda item: item.get('created_at', ''), reverse=True)
              for item in rows[keep:]:
                  artifact_id = item['id']
                  url = f'https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}'
                  req = urllib.request.Request(url, headers=headers, method='DELETE')
                  with urllib.request.urlopen(req):
                      pass
                  deleted += 1
                  print(f'Deleted {name} artifact {artifact_id}')

          print(f'Cleanup complete. Deleted {deleted} old artifact(s).')
          PY
