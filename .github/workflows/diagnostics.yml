name: Briskers Diagnostics

on:
  push:
    branches: [fix/bugs38-round1-historical-edit-guard, fix/bugs38-consolidated, fix/payroll-link-invoice-expenses-20261118, fix/4742-expense-filter-integration-20261119, fix/job-mechanic-nickname-first-frame-20261119, fix/4743-device-regressions, fix/job-finish-all-zero-hours-20261119, fix/offline-warranty-pdf-signature-20261119]
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - '.github/workflows/diagnostics.yml'
      - '.github/workflows/android-debug.yml'
      - 'tools/require_candidate_checks.py'
      - 'tools/tests/test_candidate_checks.py'
      - 'tools/tests/test_apk_certificate_verification.py'
      - 'tools/audit_ui_actions.py'

# Build/test commands never transmit Flutter or Dart analytics.
env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DASH__SUPPRESS_ANALYTICS: 'true'

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Create Flutter test shell
        run: |
          mkdir generated
          cd generated
          flutter create --platforms=android --org com.briskers --project-name briskers_app .
          rm -rf lib test
          cp -R ../lib ./lib
          cp -R ../test ./test
          if [ -d ../assets ]; then cp -R ../assets ./assets; fi
          cp ../pubspec.yaml ./pubspec.yaml
          cp ../analysis_options.yaml ./analysis_options.yaml

      - name: Resolve packages
        working-directory: generated
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flutter pub get
          bash "$GITHUB_WORKSPACE/tools/ci_sqlite_assets.sh"

      - name: Generate local database code
        working-directory: generated
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Audit UI action placeholders
        run: python3 tools/audit_ui_actions.py

      - name: Verify release certificate output parser
        run: python3 tools/tests/test_apk_certificate_verification.py

      - name: Verify fail-closed candidate CI gate
        run: python3 tools/tests/test_candidate_checks.py

      - name: Verify payment category patch against isolated PostgreSQL
        working-directory: tools/tests/customer_payment_category
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node run.mjs
          node payee-reconciliation.mjs
          node finalization.mjs
          node employee-details.mjs

      - name: Verify indexed estimate conversion reads
        run: python3 tools/tests/test_estimate_projection_query.py

      - name: Analyze Dart
        working-directory: generated
        run: flutter analyze

      - name: Verify current held-batch regressions (no APK)
        id: held_batch
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        working-directory: generated
        run: >-
          flutter test --reporter expanded --timeout 45s
          test/invoice_catalog_replacement_test.dart
          test/catalog_replacement_type_guard_test.dart
          test/paid_labor_manager_access_test.dart
          test/bugs31_invoice_mechanic_one_login_test.dart
          test/bugs31_invoice_mechanic_test_row_parity_test.dart
          test/expense_filter_preferences_test.dart
          test/expenses_filter_restart_test.dart
          test/invoice_expense_reader_test.dart
          test/invoice_expenses_tab_preload_test.dart
          test/invoice_number_preview_test.dart
          test/bugs39_weekly_labor_provenance_test.dart
          test/nov18_main_mechanic_first_frame_test.dart
          test/job_mechanic_nickname_first_frame_test.dart
          test/job_create_nickname_menu_test.dart
          test/job_task_bulk_completion_test.dart
          test/offline_warranty_pdf_signature_test.dart
          test/bugs39_estimate_conversion_projection_test.dart
          test/estimate_local_header_and_preview_test.dart
          test/home_closed_invoice_attention_test.dart
          test/customer_identity_marker_test.dart
          test/nov18_employee_work_scoped_read_test.dart

      - name: Verify remaining Bugs 26 regressions
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        working-directory: generated
        run: >-
          flutter test --reporter expanded --timeout 45s
          test/bugs26_receipt_original_offline_test.dart
          test/bugs26_receipt_preview_locale_test.dart
          test/bugs26_expense_identity_guard_test.dart
          test/bugs26_invoice_link_customer_conflict_test.dart
          test/bugs26_mileage_restart_and_scope_test.dart
          test/bugs26_small_phone_entry_controls_test.dart
          test/expense_detail_preview_hydration_test.dart
          test/offline_expense_detail_route_test.dart

      - name: Verify enabled regular Tasks and Payroll navigation
        if: ${{ !cancelled() }}
        working-directory: generated
        run: flutter test --dart-define=BRISKERS_ENABLE_OWNER_PAYROLL=true --reporter expanded test/b2568_regular_navigation_test.dart

      - name: Run diagnostic and regression tests
        if: ${{ !cancelled() && steps.held_batch.outcome == 'success' }}
        working-directory: generated
        run: flutter test

      - name: Upload synthetic PDF visual fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briskers-pdf-quantity-qa
          path: generated/build/pdf-qa/*.pdf
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload exact-source payroll widget QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briskers-payroll-source-qa
          path: generated/build/payroll-qa/*.png
          if-no-files-found: ignore
          retention-days: 14
