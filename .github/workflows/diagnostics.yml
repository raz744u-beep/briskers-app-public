name: Briskers Diagnostics

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - '.github/workflows/diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter test shell
        run: |
          mkdir generated
          cd generated
          flutter create --platforms=android --org com.briskers --project-name briskers_app .
          rm -rf lib test
          cp -R ../lib ./lib
          cp -R ../test ./test
          if [ -d ../assets ]; then cp -R ../assets ./assets; fi
          cp ../pubspec.yaml ./pubspec.yaml
          cp ../analysis_options.yaml ./analysis_options.yaml

      - name: Resolve packages
        working-directory: generated
        run: flutter pub get

      - name: Generate local database code
        working-directory: generated
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Audit UI action placeholders
        run: python3 tools/audit_ui_actions.py

      - name: Analyze Dart
        working-directory: generated
        run: flutter analyze

      - name: Run diagnostic and regression tests
        working-directory: generated
        run: flutter test

      - name: Run synthetic Owner Delete gate (disabled)
        working-directory: generated
        run: >-
          flutter test test/owner_delete_v3_sandbox_gate_test.dart
          --dart-define=BRISKERS_SYNTHETIC_BUILD=true
          --dart-define=BRISKERS_SYNTHETIC_PUBLISHABLE_KEY=sb_publishable_ci_placeholder
          --dart-define=BRISKERS_OWNER_DELETE_V3_FEED=false

      - name: Run synthetic Owner Delete gate (test feed flag)
        working-directory: generated
        run: >-
          flutter test test/owner_delete_v3_sandbox_gate_test.dart
          --dart-define=BRISKERS_SYNTHETIC_BUILD=true
          --dart-define=BRISKERS_SYNTHETIC_PUBLISHABLE_KEY=sb_publishable_ci_placeholder
          --dart-define=BRISKERS_OWNER_DELETE_V3_FEED=true

      - name: Verify production ignores deletion-feed flag
        working-directory: generated
        run: >-
          flutter test test/owner_delete_v3_sandbox_gate_test.dart
          --dart-define=BRISKERS_OWNER_DELETE_V3_FEED=true
