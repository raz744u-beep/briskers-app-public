name: Briskers Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'supabase/migrations/**'
      - 'tools/tests/**'
      - '.github/workflows/diagnostics.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'supabase/migrations/**'
      - 'tools/tests/**'
      - '.github/workflows/diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter test shell
        run: |
          mkdir generated
          cd generated
          flutter create --platforms=android --org com.briskers --project-name briskers_app .
          rm -rf lib test
          cp -R ../lib ./lib
          cp -R ../test ./test
          if [ -d ../assets ]; then cp -R ../assets ./assets; fi
          cp ../pubspec.yaml ./pubspec.yaml
          cp ../analysis_options.yaml ./analysis_options.yaml

      - name: Resolve packages
        working-directory: generated
        run: flutter pub get

      - name: Generate local database code
        working-directory: generated
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Audit UI action placeholders
        run: python3 tools/audit_ui_actions.py

      - name: Analyze Dart
        working-directory: generated
        run: flutter analyze

      - name: Run diagnostic and regression tests
        working-directory: generated
        run: flutter test

  cleanup-postgres:
    name: Guarded cleanup / native PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        # Official exact-version image; isolated synthetic databases only.
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Test cleanup permissions, registry, rollback and concurrent replay
        env:
          CLEANUP_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: bash tools/tests/run_test_job_cleanup_native.sh
