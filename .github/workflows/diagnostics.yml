name: Briskers Diagnostics

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - '.github/workflows/diagnostics.yml'
      - 'tools/tests/**'
      - 'tools/migrations/**'
      - 'supabase/migrations/**'

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter test shell
        run: |
          mkdir generated
          cd generated
          flutter create --platforms=android --org com.briskers --project-name briskers_app .
          rm -rf lib test
          cp -R ../lib ./lib
          cp -R ../test ./test
          if [ -d ../assets ]; then cp -R ../assets ./assets; fi
          cp ../pubspec.yaml ./pubspec.yaml
          cp ../analysis_options.yaml ./analysis_options.yaml

      - name: Resolve packages
        working-directory: generated
        run: flutter pub get

      - name: Generate local database code
        working-directory: generated
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Audit UI action placeholders
        run: python3 tools/audit_ui_actions.py

      - name: Verify release certificate output parser
        run: python3 tools/tests/test_apk_certificate_verification.py

      - name: Analyze Dart
        working-directory: generated
        run: flutter analyze

      - name: Run diagnostic and regression tests
        working-directory: generated
        run: flutter test

      - name: Upload synthetic PDF visual fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briskers-pdf-quantity-qa
          path: generated/build/pdf-qa/*.pdf
          if-no-files-found: ignore
          retention-days: 7

  owner-payment-guard:
    name: Owner financial permissions / isolated PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: briskers_owner_guard_synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d briskers_owner_guard_synthetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Test Owner financial guard against synthetic data only
        env:
          ACK_SYNTHETIC_POSTGRES: '1'
          PGPASSWORD: synthetic-test-only
        run: tools/tests/owner_invoice_guard/run.sh

  standard-notes-sql:
    name: Standard Notes / isolated SQL contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated test engine
        run: npm install --prefix "$RUNNER_TEMP/briskers-sql-tools" --no-audit --no-fund --save-exact @electric-sql/pglite@0.5.9
      - name: Verify note permissions and conflict contracts
        run: PGLITE_MODULE="$RUNNER_TEMP/briskers-sql-tools/node_modules/@electric-sql/pglite/dist/index.js" node tools/tests/standard_note_styles_sql_test.mjs
