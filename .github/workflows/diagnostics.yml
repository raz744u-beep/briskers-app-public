name: Briskers Diagnostics

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - '.github/workflows/diagnostics.yml'
      - 'tools/tests/test_apk_certificate_verification.py'
      - 'tools/audit_ui_actions.py'

# Build/test commands never transmit Flutter or Dart analytics.
env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DASH__SUPPRESS_ANALYTICS: 'true'

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter test shell
        run: |
          mkdir generated
          cd generated
          flutter create --platforms=android --org com.briskers --project-name briskers_app .
          rm -rf lib test
          cp -R ../lib ./lib
          cp -R ../test ./test
          if [ -d ../assets ]; then cp -R ../assets ./assets; fi
          cp ../pubspec.yaml ./pubspec.yaml
          cp ../analysis_options.yaml ./analysis_options.yaml

      - name: Resolve packages
        working-directory: generated
        run: flutter pub get

      - name: Generate local database code
        working-directory: generated
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Audit UI action placeholders
        run: python3 tools/audit_ui_actions.py

      - name: Verify release certificate output parser
        run: python3 tools/tests/test_apk_certificate_verification.py

      - name: Analyze Dart
        working-directory: generated
        run: flutter analyze

      - name: Run diagnostic and regression tests
        working-directory: generated
        run: flutter test

      - name: Upload synthetic PDF visual fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briskers-pdf-quantity-qa
          path: generated/build/pdf-qa/*.pdf
          if-no-files-found: ignore
          retention-days: 7
